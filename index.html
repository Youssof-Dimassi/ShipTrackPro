<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShipTrackPro: track your shipments in real time, anywhere in the world.">
  <title>ShipTrackPro | Shipment Tracking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Header: logo + main navigation ===== -->
  <header class="site-header" id="top">
    <a href="#top" class="logo">ShipTrackPro</a>

    <nav class="main-nav" aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="#top">Home</a></li>
        <li><a href="#track">Track</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- ===== Hero: main title + tracking form ===== -->
    <section class="hero" id="track">
      <h1 class="hero-title">Track your shipment, anywhere in the world</h1>
      <p class="hero-text">Enter your tracking number to see where your package is and when it will arrive.</p>

      <form class="track-form">
        <label for="tracking-number" class="track-label">Tracking number</label>
        <div class="track-row">
          <input
            type="text"
            id="tracking-number"
            name="tracking-number"
            class="track-input"
            placeholder="e.g. STP-123456789"
            autocomplete="off"
            required
          >
          <button type="submit" class="btn">Track</button>
        </div>
      </form>
    </section>

    <!-- Features and How it works sections go here (steps 4-5) -->
  </main>

  <!-- Footer goes here (step 6) -->

</body>
</html>
